<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title th:text="'Weather — ' + ${city}">Weather</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css"
    />

    <style>
      body {
        font-family: "Inter", Arial, sans-serif;
      }
      .glass {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.03),
          rgba(255, 255, 255, 0.02)
        );
        border: 1px solid rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(8px);
      }
      .app-bg {
        background: linear-gradient(
            180deg,
            rgba(4, 9, 30, 0.65),
            rgba(2, 6, 22, 0.8)
          ),
          url("/images/image.png") center/cover no-repeat fixed;
      }
      .wi-large {
        font-size: 6rem;
        color: #ffd166;
      }
    </style>
  </head>
  <body class="app-bg min-h-screen flex items-center">
    <div class="container mx-auto px-4">
      <div class="max-w-4xl mx-auto">
        <div class="glass rounded-xl p-6 md:p-8 text-white shadow-2xl mt-16">
          <div class="flex items-center justify-between mb-4">
            <!-- Back to search -->
            <a
              href="/"
              class="text-sm bg-white/6 px-3 py-2 rounded-lg hover:bg-white/8"
              >← Search another city</a
            >

            <!-- City and last fetched time -->
            <div class="text-right">
              <div
                class="text-lg font-semibold"
                th:text="${city} + ', ' + ${country}"
              >
                City, Country
              </div>
              <div
                class="text-xs text-slate-400"
                th:text="${#dates.format(fetchedAt, 'dd MMM yyyy HH:mm')}"
              >
                Last updated
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
            <!-- Icon + big temp -->
            <div class="text-center md:col-span-1">
              <div class="mb-2">
                <!-- weatherIcon class is provided by backend -->
                <span th:classappend="${weatherIcon} + ' wi-large'"></span>
              </div>
              <div class="text-4xl font-bold" th:text="${temperature} + '°C'">
                20°C
              </div>
              <div
                class="text-sm text-slate-300 mt-1"
                th:text="${weatherDescription}"
              >
                clear sky
              </div>
            </div>

            <!-- Details -->
            <div class="md:col-span-2">
              <ul class="space-y-3 text-lg">
                <li>
                  <strong>Humidity:</strong>
                  <span th:text="${humidity} + '%'">50%</span>
                </li>
                <li>
                  <strong>Wind:</strong>
                  <span th:text="${windSpeed} + ' m/s'">3.2 m/s</span>
                </li>
                <li>
                  <strong>Description:</strong>
                  <span th:text="${weatherDescription}">clear sky</span>
                </li>
              </ul>

              <div class="mt-6 flex gap-3">
                <a
                  th:href="@{/}"
                  class="px-4 py-2 rounded-lg bg-white/6 hover:bg-white/8"
                  >New search</a
                >
                <a
                  th:href="@{/weather(city=${city})}"
                  class="px-4 py-2 rounded-lg bg-gradient-to-r from-emerald-400 to-cyan-500"
                  >Refresh</a
                >
              </div>
            </div>
          </div>

          <!-- Error block (shows when backend sets 'error') -->
          <div
            th:if="${error}"
            class="mt-6 bg-red-600/20 border border-red-600/40 text-red-100 p-3 rounded"
          >
            <strong>Error:</strong>
            <span th:text="${error}">Error message</span>
          </div>
        </div>
      </div>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
