<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>⛅ Weather App</title>

    <!-- Tailwind CDN for development/prototype -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Weather Icons (if you use 'wi wi-owm-...' classes) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css"
    />

    <style>
      body {
        font-family: "Inter", Arial, sans-serif;
      }
      .app-bg {
        /* Background image and dark gradient overlay */
        background: linear-gradient(
            180deg,
            rgba(4, 9, 30, 0.65),
            rgba(2, 6, 22, 0.8)
          ),
          url("/images/image.png") center/cover no-repeat fixed;
      }
      .glass {
        /* Frosted glass card effect */
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.03),
          rgba(255, 255, 255, 0.02)
        );
        border: 1px solid rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(8px);
      }
      .input-glow:focus {
        box-shadow: 0 0 0 6px rgba(99, 102, 241, 0.06);
        outline: none;
      }
    </style>
  </head>
  <body class="app-bg min-h-screen flex items-center">
    <div class="container mx-auto px-4">
      <div class="max-w-xl mx-auto">
        <!-- Main glass card -->
        <div class="glass rounded-xl p-6 md:p-10 text-white shadow-2xl mt-16">
          <div class="text-center mb-4">
            <h1 class="text-3xl md:text-4xl font-semibold">Weather App</h1>
            <p class="text-sm text-slate-300 mt-1">
              Check the weather for any city
            </p>
          </div>

          <!-- Search form: performs GET /weather -->
          <form
            id="cityForm"
            action="/weather"
            method="get"
            class="mt-6 grid grid-cols-1 sm:grid-cols-4 gap-3"
          >
            <div class="sm:col-span-3">
              <input
                id="cityInput"
                name="city"
                type="search"
                required
                autocomplete="off"
                class="w-full rounded-lg px-4 py-3 bg-white/10 text-slate-100 placeholder:text-slate-300 input-glow"
                placeholder="E.g. Buenos Aires, London, New York"
              />
            </div>

            <div class="sm:col-span-1">
              <button
                id="submitBtn"
                type="submit"
                class="w-full rounded-lg px-4 py-3 bg-gradient-to-r from-emerald-400 to-cyan-500 hover:from-emerald-500 hover:to-cyan-600 transition font-medium"
              >
                <span id="btnText">Get Weather</span>
                <!-- small inline spinner (hidden by default) -->
                <svg
                  id="btnSpinner"
                  class="hidden animate-spin w-4 h-4 inline-block ml-2 text-white"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <circle
                    class="opacity-25"
                    cx="12"
                    cy="12"
                    r="10"
                    stroke="currentColor"
                    stroke-width="4"
                  ></circle>
                  <path
                    class="opacity-75"
                    fill="currentColor"
                    d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
                  ></path>
                </svg>
              </button>
            </div>

            <div class="sm:col-span-4 mt-3 text-center text-sm text-slate-300">
              Units: °C · Powered by OpenWeather
            </div>
          </form>

          <div id="hint" class="mt-3 text-center text-xs text-slate-400">
            Tip: try "Buenos Aires", "Tokyo" or "San Francisco".
          </div>
        </div>
      </div>
    </div>

    <!-- App JS (handles spinner UX) -->
    <script src="/js/app.js"></script>
  </body>
</html>
